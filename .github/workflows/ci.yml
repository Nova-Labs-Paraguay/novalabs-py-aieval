name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - name: Emit lockfile for freeze
        run: |
          echo 'LOCKFILE_GZIP_B64_BEGIN'
          gzip -c package-lock.json | base64 -w0
          echo
          echo 'LOCKFILE_GZIP_B64_END'
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:release
