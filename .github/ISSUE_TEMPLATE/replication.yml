name: Replication / methodological critique
description: Submit an independent replication or evidence-backed critique.
body:
  - type: input
    id: version
    attributes: {label: Release / protocol version}
    validations: {required: true}
  - type: input
    id: domain
    attributes: {label: Affected task or domain}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Evidence or artifact}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed correction or independent result}
    validations: {required: true}
