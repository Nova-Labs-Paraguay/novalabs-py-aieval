name: Bug / reproducibility failure
description: Report a reproducibility or implementation failure.
body:
  - type: input
    id: version
    attributes: {label: Release version}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: Environment}
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: observed
    attributes: {label: Expected and observed behavior}
    validations: {required: true}
