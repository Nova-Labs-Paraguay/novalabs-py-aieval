name: CI
on: [push]
permissions:
  contents: write
jobs:
  freeze-lockfile:
    if: github.ref == 'refs/heads/release/freeze-dependencies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/freeze-dependencies
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already frozen'
          else
            git commit -m 'build: freeze npm dependency graph'
            git push origin HEAD:release/freeze-dependencies
          fi
